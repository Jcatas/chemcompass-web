<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemCompass Web Query</title>
    <meta http-equiv="refresh" content="0; url=https://dark-bears-pull.loca.lt">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #6ee7b7;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            color: #a5b4fc;
            font-size: 1.2em;
            line-height: 1.6;
        }
        a {
            color: #6ee7b7;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a2a3a;
            border-top-color: #6ee7b7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 ChemCompass Web Query</h1>
        <p>
            <span class="loading"></span>

        </p>
        <p>
            如果没有自动跳转，请<a href="https://dark-bears-pull.loca.lt">点击这里</a>
